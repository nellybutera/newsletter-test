name: Newsletter Tests CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop, feature/*]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Chrome installation
        run: google-chrome --version

      - name: Run tests
        id: run_tests
        env:
          MAVEN_OPTS: "-Xmx1g"
        run: mvn -B clean test -Dheadless=true -DtrimStackTrace=false -Dsurefire.printSummary=true

      - name: Extract test results
        if: always()
        id: test_results
        run: |
          COMMIT_SHA=${GITHUB_SHA:0:7}
          TOTAL=0; FAILED=0; SKIPPED=0

          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            while read -r line; do
              RUN=$(echo  "$line" | sed -n 's/.*Tests run: \([0-9]*\).*/\1/p')
              FAIL=$(echo "$line" | sed -n 's/.*Failures: \([0-9]*\).*/\1/p')
              ERR=$(echo  "$line" | sed -n 's/.*Errors: \([0-9]*\).*/\1/p')
              SKIP=$(echo "$line" | sed -n 's/.*Skipped: \([0-9]*\).*/\1/p')
              if [ -n "$RUN" ]; then
                TOTAL=$((TOTAL + RUN))
                FAILED=$((FAILED + FAIL + ERR))
                SKIPPED=$((SKIPPED + SKIP))
              fi
            done < <(grep -h "Tests run:" target/surefire-reports/*.txt || true)
          fi

          PASSED=$((TOTAL - FAILED - SKIPPED))

          FAILING_TESTS_RAW=$(python3 << 'PYTHON_EOF'
          import xml.etree.ElementTree as ET
          import glob

          failing = []
          for xml_file in glob.glob('target/surefire-reports/TEST-*.xml'):
              tree = ET.parse(xml_file)
              for tc in tree.getroot().findall('.//testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      failing.append(tc.get('name', ''))
          for t in sorted(set(failing)):
              print(t)
          PYTHON_EOF
          )

          FAILING_TESTS_JSON=$(echo "$FAILING_TESTS_RAW" | sed ':a;N;$!ba;s/\n/\\n/g')

          echo "commit_sha=$COMMIT_SHA"            >> $GITHUB_OUTPUT
          echo "total=$TOTAL"                      >> $GITHUB_OUTPUT
          echo "passed=$PASSED"                    >> $GITHUB_OUTPUT
          echo "failed=$FAILED"                    >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED"                  >> $GITHUB_OUTPUT
          echo "failing_tests_raw<<EOF"            >> $GITHUB_OUTPUT
          echo "$FAILING_TESTS_RAW"                >> $GITHUB_OUTPUT
          echo "EOF"                               >> $GITHUB_OUTPUT
          echo "failing_tests_json<<EOF"           >> $GITHUB_OUTPUT
          echo "$FAILING_TESTS_JSON"               >> $GITHUB_OUTPUT
          echo "EOF"                               >> $GITHUB_OUTPUT

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/


      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: "[${{ job.status }}] Newsletter Tests — ${{ github.ref_name }}"
          body: |
            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit     : ${{ steps.test_results.outputs.commit_sha }}
            Status     : ${{ job.status == 'success' && 'Pass' || 'Fail' }}

            ${{ job.status == 'success' && 'All tests passed.' || format('Failing Tests:\n{0}', steps.test_results.outputs.failing_tests_raw) }}

            Full Results:
            Total   : ${{ steps.test_results.outputs.total }}
            Passed  : ${{ steps.test_results.outputs.passed }}
            Failed  : ${{ steps.test_results.outputs.failed }}
            Skipped : ${{ steps.test_results.outputs.skipped }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS:        ${{ job.status }}
          REF_NAME:          ${{ github.ref_name }}
          REPOSITORY:        ${{ github.repository }}
          COMMIT_SHA:        ${{ steps.test_results.outputs.commit_sha }}
          TOTAL:             ${{ steps.test_results.outputs.total }}
          PASSED:            ${{ steps.test_results.outputs.passed }}
          FAILED:            ${{ steps.test_results.outputs.failed }}
          SKIPPED:           ${{ steps.test_results.outputs.skipped }}
          RUN_URL:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILING_TESTS:     ${{ steps.test_results.outputs.failing_tests_raw }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          status   = os.environ["JOB_STATUS"]
          emoji    = "✅" if status == "success" else "❌"
          detail   = "All tests passed." if status == "success" else f"*Failing tests:*\n{os.environ['FAILING_TESTS']}"

          text = (
            f"{emoji} *[{status.upper()}]* Newsletter Tests — `{os.environ['REF_NAME']}`\n"
            f"*Repo:* {os.environ['REPOSITORY']} | *Commit:* `{os.environ['COMMIT_SHA']}`\n"
            f"*Total:* {os.environ['TOTAL']} | *Passed:* {os.environ['PASSED']} "
            f"| *Failed:* {os.environ['FAILED']} | *Skipped:* {os.environ['SKIPPED']}\n"
            f"{detail}\n"
            f"*Run:* {os.environ['RUN_URL']}"
          )

          payload = json.dumps({"text": text})
          req = urllib.request.Request(
            os.environ["SLACK_WEBHOOK_URL"],
            data=payload.encode(),
            headers={"Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req) as resp:
            print(resp.read().decode())
          EOF
